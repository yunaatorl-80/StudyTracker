<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fd0">
<title>StudyTracker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StudyTracker">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="profwrap" id="prof-wrap">
      <button class="profchip" id="prof-btn" data-act="profMenu" title="Mon profil">
        <span id="prof-av"></span><span class="profname" id="prof-name">Mon profil</span>
      </button>
    </div>
    <div class="logo">
      <div class="mark"><img src="logo.png" alt="StudyTracker"></div>
      <div class="brand">StudyTracker<small>Ton suivi de cours, de QCM et de notes</small></div>
    </div>
    <div class="tools">
      <div class="themewrap" id="theme-wrap">
        <button class="profchip" id="theme-btn" data-act="themeOpen" title="Changer de thème">
          <span class="tdot" aria-hidden="true"></span><span class="profname" id="theme-name">Auto</span>
        </button>
      </div>
      <label class="mut" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="rk" data-act="rank"> Rangs</label>
    </div>
  </header>
  <div id="install-host"></div>
  <nav id="nav"></nav>
  <div id="app"></div>
</div>
<footer>StudyTracker · Créé par <b>Lem HORNOY</b></footer>
<div id="toast"></div>
<script src="mammoth.browser.min.js"></script>
<script src="app.js"></script>
<script>
// Service worker : application installable et utilisable hors ligne
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
